name = "dichomnion-gateway"
main = "src/index.ts"
compatibility_date = "2023-12-01"
# Tài khoản Cloudflare đích cho deploy thật (Track A). Không phải bí mật (account id
# hiện ngay trên URL dashboard). Có thể override bằng env CLOUDFLARE_ACCOUNT_ID.
account_id = "385e2b411beb41a79d6b45477bc3f544"

# KV: rate-limit đăng ký, idempotency job, trạng thái job/kết quả, và cờ kill switch.
# id dưới đây là PLACEHOLDER cho dev. TRƯỚC KHI deploy thật phải tạo namespace và thay id:
#   cd apps/gateway && wrangler kv namespace create KV_CACHE
#   -> dán id trả về vào trường `id` dưới đây (hoặc dùng --preview cho môi trường preview).
[[kv_namespaces]]
binding = "KV_CACHE"
id = "local-kv-id-for-dev"

# --- M1 (ADR 0001): điều phối job BỀN VỮNG (Durable Object + Queue) ----------
# JobCoordinator Durable Object = nguồn-sự-thật NGUYÊN TỬ cho vòng đời mỗi job (một
# instance cho mỗi <deviceId>:<jobId>). Queue `job-dispatch` = bàn giao BỀN VỮNG để
# Worker bị evict giữa chừng KHÔNG BAO GIỜ âm thầm mất job (consumer được redeliver).
# CẢ HAI cần gói Workers TRẢ PHÍ để DEPLOY; chạy MIỄN PHÍ cục bộ dưới `wrangler dev`
# (Miniflare) và hợp lệ dưới `wrangler deploy --dry-run`. TRƯỚC deploy thật (Track A):
#   cd apps/gateway && wrangler queues create job-dispatch
#   cd apps/gateway && wrangler queues create job-dispatch-dlq
# (DO được cấp phát bởi [[migrations]] tag dưới đây ở lần deploy đầu — không cần lệnh CLI.)
[[durable_objects.bindings]]
name = "JOB_COORDINATOR"
class_name = "JobCoordinator"

# DO cổ điển (dựa trên fetch) → new_classes (KHÔNG phải new_sqlite_classes). Chỉ THÊM
# nên an toàn với compatibility_date hiện tại; chỉ tăng tag khi đổi schema về sau.
[[migrations]]
tag = "v1"
new_classes = ["JobCoordinator"]

# Producer handle mà POST /api/jobs/create dùng để enqueue message dispatch.
[[queues.producers]]
binding = "JOB_DISPATCH_QUEUE"
queue = "job-dispatch"

# Consumer = handler `.queue` của Worker (handleJobQueue). Mỗi lần một job
# (max_batch_size = 1) để cô lập một lượt dispatch GPU nặng; message hỏng CATASTROPHIC
# lặp lại sẽ vào DLQ sau max_retries thay vì lặp vô hạn.
[[queues.consumers]]
queue = "job-dispatch"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "job-dispatch-dlq"

# --- Biến cấu hình công khai (đặt trong [vars] hoặc Dashboard) ---------------
[vars]
# URL của GPU worker riêng (chỉ Gateway gọi tới). Mặc định loopback cho dev cục bộ.
# PRODUCTION: Worker nằm sau Cloudflare Tunnel (cloudflared) -> đặt WORKER_URL = URL tunnel
# (vd https://worker-xxxx.trycloudflare.com hoặc hostname tunnel đã đặt). Worker KHÔNG mở
# IP public; tunnel là đường vào riêng duy nhất. Xem docs/DEPLOYMENT.md (Track A, bước tunnel).
WORKER_URL = "http://127.0.0.1:8000"
# Danh sách origin client được phép (CORS). KHÔNG dùng "*".
ALLOWED_ORIGINS = "tauri://localhost,https://tauri.localhost,http://localhost:1420,http://localhost:5173"
# Ngưỡng thời gian Trạm 3 (tùy chọn, có mặc định trong code):
# MIN_PLAUSIBLE_MS = "2000"
# MAX_RENDER_MS = "900000"
# Trần kích thước job — phản chiếu trần worker (tùy chọn, có mặc định trong code).
# GIỮ COMMENT: bỏ comment = ghi giá trị vào [vars] và ĐỔI runtime limit.
# MAX_SEGMENTS = "2000"
# MAX_SEGMENT_TEXT_CHARS = "2000"
# MAX_TOTAL_TEXT_CHARS = "200000"
# MAX_SEGMENT_META_CHARS = "256"
# Throttle tạo job mỗi thiết bị (tùy chọn, có mặc định trong code):
# JOBS_RATE_LIMIT = "60"
# JOBS_WINDOW_S = "3600"

# R2 (object storage cho AUDIO) — endpoint POST /api/uploads/presign ký presigned URL mỗi
# job (Option A: Gateway ký, KHÔNG trung chuyển bytes). R2_ACCOUNT_ID/R2_BUCKET KHÔNG bí mật
# nên đặt ở [vars]; bỏ comment và điền khi deploy (ACCESS_KEY/SECRET là secret — xem dưới).
# Thiếu bất kỳ biến BẮT BUỘC nào (kể cả 2 secret) → endpoint FAIL-CLOSED 503, không job nào chạy.
# 2 biến KHÔNG bí mật dưới đây để mở sẵn (endpoint vẫn 503 tới khi 2 secret ACCESS/SECRET được
# nạp qua `wrangler secret put`); mở sẵn để tránh quên uncomment lúc deploy → presign 503 oan.
R2_ACCOUNT_ID = "385e2b411beb41a79d6b45477bc3f544"
R2_BUCKET = "sonsonjh"
# Tuỳ chọn (có mặc định trong code): R2_REGION="auto", R2_PRESIGN_EXPIRES_S="7200" (max 604800),
# PRESIGN_RATE_LIMIT="60", PRESIGN_WINDOW_S="3600".
# R2_REGION = "auto"
# R2_PRESIGN_EXPIRES_S = "7200"
# PRESIGN_RATE_LIMIT = "60"
# PRESIGN_WINDOW_S = "3600"

# --- SECRETS (KHÔNG commit — nạp bằng: wrangler secret put <TÊN>) ------------
# GATEWAY_JWT_PRIVATE_KEY : PKCS8 PEM khóa RIÊNG ES256 (P-256) của Gateway.
#                           Worker chỉ giữ khóa CÔNG KHAI tương ứng (Trạm 2).
#                           Sinh cả cặp bằng helper (in sẵn lệnh nạp cho mỗi bên):
#                             scripts/gen-gateway-keys.sh
#                           (public SPKI PEM -> đặt vào GATEWAY_JWT_PUBLIC_KEY của worker)
# TURNSTILE_SECRET        : Secret key Cloudflare Turnstile (chống bot khi đăng ký).
# ADMIN_TOKEN             : Bí mật chia sẻ cho watchdog Financial Kill Switch
#                           (apps/gateway/scripts/kill-switch-monitor.mjs) gọi /api/admin/kill-switch.
# R2_ACCESS_KEY_ID        : Access Key ID của R2 S3 API token (Object Read & Write).
# R2_SECRET_ACCESS_KEY    : Secret Access Key tương ứng — Gateway ký SigV4 cho /api/uploads/presign.
#                           Tạo token: Dashboard → R2 → Manage R2 API Tokens.
