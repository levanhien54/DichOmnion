name: build-worker-overlay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-worker-overlay
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push direct linux/amd64 manifest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/gpu-worker
          file: apps/gpu-worker/Dockerfile.async-overlay
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: lethtihuy/dichomnion-worker:async-analyze-${{ github.sha }}

      - name: Record immutable digest
        run: |
          echo "image=lethtihuy/dichomnion-worker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "lethtihuy/dichomnion-worker@${{ steps.build.outputs.digest }}"
